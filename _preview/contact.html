<script>
(function(){
  var root = document.documentElement;
  var toggle = document.getElementById('themeToggle');
  function setTheme(t){ root.setAttribute('data-theme', t); localStorage.setItem('theme', t); }
  toggle.addEventListener('click', function(){ setTheme(root.getAttribute('data-theme') === 'night' ? 'day' : 'night'); });
  setTheme(localStorage.getItem('theme') || 'day');
  var vig = document.getElementById('vignette'), range = document.getElementById('vigrange'), val = document.getElementById('vigval');
  function applyVig(v){ vig.style.opacity = (v/100).toFixed(2); val.textContent = v; range.value = v; localStorage.setItem('vigStrength', v); }
  range.addEventListener('input', function(){ applyVig(range.value); });
  var sv = localStorage.getItem('vigStrength'); applyVig(sv !== null ? sv : 60);
})();
</script>
